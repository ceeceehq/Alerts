name: Seasonal produce

# 1st and 15th of each month, 07:00 UTC (8am in summer, 7am in winter).
# Scheduled runs send the regions in SCHEDULED_REGIONS; add malmo there (space
# separated) to start the Malmö email. A manual run sends the chosen region.
on:
  schedule:
    - cron: "0 7 1,15 * *"
  workflow_dispatch:
    inputs:
      region:
        description: "Which list to send"
        type: choice
        options: [uk, malmo]
        default: uk

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ALERT_TO: ${{ secrets.ALERT_TO }}
      SCHEDULED_REGIONS: uk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          for region in ${{ inputs.region || '$SCHEDULED_REGIONS' }}; do
            python produce_alert.py --region "$region"
          done
