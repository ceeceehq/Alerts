name: Check TrustedHouseSitters

on:
  schedule:
    - cron: "*/5 * * * *"  # GitHub may run this a few minutes late
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a test email with the newest listing"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python ths_alert.py ${{ inputs.test_email && '--test-email' || '' }}
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
      - name: Save seen listings
        run: |
          git config user.name "ths-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "Update seen listings" && git push)
